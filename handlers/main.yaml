---
- name: normalize inspect the systemd runtime before reload
  listen: normalize daemon-reload

  ansible.builtin.stat:
    path: /run/systemd/system
  register: normalize_reload_runtime
- name: normalize reload the active systemd manager
  listen: normalize daemon-reload

  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - ansible_facts.get('service_mgr') == 'systemd'
    - normalize_reload_runtime.stat.isdir | default(false)
- name: normalize inspect the systemd runtime before cockpit shutdown
  listen: normalize stop cockpit

  ansible.builtin.stat:
    path: /run/systemd/system
  register: normalize_cockpit_handler_runtime
- name: normalize refresh cockpit activation states before shutdown
  listen: normalize stop cockpit

  ansible.builtin.command:
    argv: [systemctl, show, --property=ActiveState, --value, "{{ item }}"]
  register: normalize_cockpit_shutdown_states
  changed_when: false
  loop:
    - cockpit.socket
    - cockpit.service
  when:
    - not ansible_check_mode
    - normalize_cockpit_handler_runtime.stat.isdir | default(false)
- name: normalize stop active cockpit units
  listen: normalize stop cockpit

  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
  loop: "{{ normalize_cockpit_shutdown_states.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.stdout | default("") in ["active", "activating", "reloading"]
# Handler declaration order ensures relabeling is prepared before the reboot.
- name: normalize autorelabel
  ansible.builtin.file:
    path: /.autorelabel
    owner: root
    group: root
    state: touch
    mode: "0755"
  when: normalize_selinux_state != "disabled"

- name: normalize reboot needed
  ansible.builtin.reboot:
    post_reboot_delay: "{{ normalize_reboot_delay | default(100) }}"
  when:
    - provider is not defined or (provider is defined and provider != "ec2")
    - ansible_facts["virtualization_type"] != "docker"
