---
- name: normalize reboot needed
  ansible.builtin.reboot:
    post_reboot_delay: '{{ normalize_reboot_delay | default(100) }}'
  when: provider is not defined or (provider is defined and provider != "ec2")

- name: normalize autorelabel
  ansible.builtin.file:
    path: /.autorelabel
    owner: root
    group: root
    state: touch
    mode: '0755'
