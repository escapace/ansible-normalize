---
- name: install common dependencies
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
    update_cache: true
  vars:
    packages:
      - dnf-plugins-core
      - jq
      - kitty-terminfo
      - ghostty-terminfo
      - tar

- name: uninstall unnecessary packages
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: absent
  vars:
    packages:
      - cockpit

- name: clean up dnf
  ansible.builtin.command: dnf clean all
  changed_when: false
