---

- name: disable ssh reverse dns lookup
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "(.*UseDNS.*)"
    line: "UseDNS no"
    backrefs: true
    state: present
    create: false

- name: configure ssh daemon
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - regexp: ^UseDNS
      line: UseDNS no
    - regexp: ^GSSAPIAuthentication
      line: GSSAPIAuthentication no
