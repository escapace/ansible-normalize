---
- name: install systemd-networkd
  ansible.builtin.dnf:
    name: systemd-networkd
    state: present

- name: mask systemd-networkd-persistent-storage.service
  ansible.builtin.systemd:
    name: systemd-networkd-persistent-storage.service
    masked: true

- name: copy example network configuration to system configuration
  ansible.builtin.copy:
    src: /usr/lib/systemd/network/89-ethernet.network.example
    dest: /etc/systemd/network/80-ethernet.network
    remote_src: true
    mode: "0644"
  notify: normalize reboot needed

- name: create directory for systemd-networkd-wait-online override
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    mode: "0755"

- name: create override configuration for systemd-networkd-wait-online
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/wait-for-only-one-interface.conf
    mode: "0644"
  notify: normalize reboot needed

- name: check whether NetworkManager is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/NetworkManager.service
  register: normalize_network_manager_unit

- name: gather network service facts
  ansible.builtin.service_facts:

- name: enable systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd.service
    enabled: true
  notify: normalize reboot needed

- name: disable NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager.service
    enabled: false
  when: normalize_network_manager_unit.stat.exists
  notify: normalize reboot needed
