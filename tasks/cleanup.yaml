---
- name: remove autorelabel
  ansible.builtin.file:
    path: /.autorelabel
    state: absent
  tags:
    - normalize-cleanup

- name: remove old kernels
  ansible.builtin.shell: dnf remove -y $(dnf repoquery --installonly --latest-limit=-1 -q)
  tags:
    - normalize-cleanup

- name: delete dnf cache
  ansible.builtin.command: dnf clean all
  tags:
    - normalize-cleanup

- name: find dnf history files
  ansible.builtin.find:
    paths: /var/lib/dnf
    patterns: "history*"
  register: normalize_dnf_history
  tags:
    - normalize-cleanup

- name: reset dnf history
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ normalize_dnf_history.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - normalize-cleanup

- name: find temporary files
  ansible.builtin.find:
    file_type: any
    paths:
      - /tmp
      - /var/tmp
    patterns: "*"
  register: normalize_tmp_files
  tags:
    - normalize-cleanup

- name: remove temporary files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ normalize_tmp_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - normalize-cleanup

- name: remove ssh host keys
  when: normalize_remove_ssh_host_keys | bool
  tags:
    - normalize-cleanup
  block:
    - name: find ssh host keys
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "*host*key*"
      register: normalize_host_keys

    - name: remove ssh host keys
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ normalize_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: remove kickstart files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/anaconda-ks.cfg
    - /root/original-ks.cfg
  tags:
    - normalize-cleanup

- name: truncate files
  ansible.builtin.command: "truncate -s 0 {{ item }}"
  loop:
    - /etc/machine-id
    - /etc/resolv.conf
    - /var/log/audit/audit.log
    - /var/log/wtmp
    - /var/log/lastlog
    - /var/log/btmp
    - /var/log/cron
    - /var/log/maillog
    - /var/log/messages
    - /var/log/secure
    - /var/log/spooler
  ignore_errors: true
  tags:
    - normalize-cleanup

- name: remove log folders.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/log/anaconda
    - /var/log/qemu-ga
    - /var/log/tuned
    - /var/lib/cloud
    - /etc/hostname
    - /etc/machine-info
    - /var/lib/systemd/credential.secret
  tags:
    - normalize-cleanup

- name: find log files.
  ansible.builtin.find:
    paths:
      - /var/log
      - /var/log/sssd
    patterns: "*log,*.old,*.log.gz,*.[0-9],*.gz,*-????????"
  register: normalize_log_files
  tags:
    - normalize-cleanup

- name: remove log files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ normalize_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
    - normalize-cleanup

- name: remove random-seed
  ansible.builtin.file:
    path: /var/lib/systemd/random-seed
    state: absent
  tags:
    - normalize-cleanup

- name: fill free space with zeroes
  ansible.builtin.shell: dd if=/dev/zero of=/zeroed_file bs=1M oflag=direct || rm -f /zeroed_file
  tags:
    - normalize-cleanup

- name: detect swap partition
  ansible.builtin.command: grep -oP '^/dev/[\w-]+' /proc/swaps
  register: normalize_swaps
  ignore_errors: true
  tags:
    - normalize-cleanup

- name: wipe out swap data
  when: normalize_swaps.rc == 0
  tags:
    - normalize-cleanup
  block:
    - name: get swap partition uuid
      ansible.builtin.command: "blkid {{ normalize_swaps.stdout }} -s UUID -o value"
      register: normalize_swap_blkid

    - name: unmount swap partition
      ansible.builtin.command: "swapoff {{ normalize_swaps.stdout }}"

    - name: fill swap partition with zeroes
      ansible.builtin.shell: "dd if=/dev/zero of={{ normalize_swaps.stdout }} bs=1M oflag=direct || /bin/true"

    - name: format swap partition
      ansible.builtin.command: "mkswap -U {{ normalize_swap_blkid.stdout }} -f {{ normalize_swaps.stdout }}"

    - name: mount swap partition
      ansible.builtin.command: "swapon {{ normalize_swaps.stdout }}"

- name: sync disc
  ansible.builtin.command: sync
  tags:
    - normalize-cleanup

- name: clear shell history
  ansible.builtin.shell: history -c
  tags:
    - normalize-cleanup
