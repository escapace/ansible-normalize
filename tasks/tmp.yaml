---
- name: create directory /etc/systemd/system/tmp.mount.d
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: create /etc/systemd/system/tmp.mount.d/override.conf
  ansible.builtin.template:
    src: templates/tmp-mount-override.conf
    dest: /etc/systemd/system/tmp.mount.d/override.conf
    mode: '0644'
    owner: root
    group: root
