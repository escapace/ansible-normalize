---
- name: increase dnf timeouts
  ansible.builtin.shell: dnf config-manager --save --setopt {{ item.option }}={{ item.value }}
  changed_when: false
  with_items:
    - option: timeout
      value: 60
    - option: retries
      value: 30

- name: ensure lock directory is created
  ansible.builtin.file:
    path: /var/lock/subsys
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: check whether postfix is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/postfix.service
  register: normalize_postfix_unit

- name: ensure that postfix is stopped
  ansible.builtin.systemd:
    name: postfix.service
    state: stopped
  when: "'postfix.service' in ansible_facts.get('services', {})"

- name: ensure that postfix is disabled
  ansible.builtin.systemd:
    name: postfix.service
    enabled: false
  when: normalize_postfix_unit.stat.exists

- name: check whether kdump is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/kdump.service
  register: normalize_kdump_unit

- name: ensure that kdump is stopped
  ansible.builtin.systemd:
    name: kdump.service
    state: stopped
  when: "'kdump.service' in ansible_facts.get('services', {})"

- name: ensure that kdump is disabled and masked
  ansible.builtin.systemd:
    name: kdump.service
    enabled: false
    masked: true
  when: normalize_kdump_unit.stat.exists

- name: configure coredump.conf
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    mode: "0644"
    owner: root
    group: root

- name: remove /etc/motd.d/cockpit
  ansible.builtin.file:
    path: /etc/motd.d/cockpit
    state: absent

- name: add /usr/local/bin to path
  ansible.builtin.copy:
    src: files/usr-local-bin.sh
    dest: /etc/profile.d/usr-local-bin.sh
    owner: root
    group: root
    mode: "0644"

- name: remove extra sysconfig files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sysconfig/network
    - /etc/sysconfig/anaconda

- name: mask debug-shell.service
  ansible.builtin.systemd:
    name: debug-shell.service
    masked: true
