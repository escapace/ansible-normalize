---
- name: check variables
  ansible.builtin.assert:
    that:
      - normalize_username is defined and normalize_username is string
      - normalize_username | length > 0
      - normalize_password is undefined or (normalize_password is string and normalize_password | length > 0)
      - normalize_key is undefined or normalize_key is none or normalize_key is string
      - normalize_reboot_delay | int >= 0
    quiet: true
    fail_msg: >-
      set a nonempty normalize_username, omit normalize_password or supply a nonempty
      secret string, use a string or null for normalize_key, and set a nonnegative
      normalize_reboot_delay

- ansible.builtin.include_tasks: normalize.yaml
  when:
    - "'normalize-cleanup' not in ansible_run_tags"
    - >-
      ansible_facts["os_family"] == "RedHat" and (
      (ansible_facts["distribution"] == "CentOS" and ansible_facts["distribution_major_version"]|int > 8) or
      (ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"]|int > 8)
      )

- ansible.builtin.include_tasks: cleanup.yaml
  tags:
    - normalize-cleanup
  when:
    - "'normalize-cleanup' in ansible_run_tags"
    - >-
      ansible_facts["os_family"] == "RedHat" and (
      (ansible_facts["distribution"] == "CentOS" and ansible_facts["distribution_major_version"]|int > 8) or
      (ansible_facts["distribution"] == "Rocky" and ansible_facts["distribution_major_version"]|int > 8)
      )
