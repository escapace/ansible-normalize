---
- name: add group
  ansible.builtin.group:
    name: "{{ normalize_username }}"
    state: present

- name: add user without password
  ansible.builtin.user:
    name: "{{ normalize_username }}"
    group: "{{ normalize_username }}"
  when: normalize_password is not defined

- name: add user with password
  ansible.builtin.user:
    name: "{{ normalize_username }}"
    group: "{{ normalize_username }}"
    # A stable host/user salt and explicit rounds avoid rehashing on every run.
    password: >-
      {{
        normalize_password | password_hash(
          'sha512',
          ([inventory_hostname, normalize_username] | to_json | hash('sha256'))[:16],
          rounds=656000
        )
      }}
  when: normalize_password is defined
  no_log: true

- name: set authorized key
  ansible.posix.authorized_key:
    user: "{{ normalize_username }}"
    state: present
    key: "{{ normalize_key }}"
  when: not((normalize_key is undefined) or (normalize_key is none) or (normalize_key | trim | length == 0))

- name: remove user password
  ansible.builtin.user:
    name: "{{ normalize_username }}"
    password: "*"
  when:
    - normalize_password is not defined
    - normalize_lock_user_password_when_undefined | bool

- name: check groups
  ansible.builtin.shell: |
    set -o pipefail
    /usr/bin/getent group | awk -F":" '{print $1}'
  args:
    executable: /bin/bash
  register: normalize_groups
  changed_when: false

- name: add secondary groups
  ansible.builtin.user:
    name: "{{ normalize_username }}"
    groups: "{{ item }}"
    append: true
  when: item in normalize_groups.stdout_lines
  with_items:
    - sudo
    - wheel

- name: allow {{ normalize_username }} to have passwordless sudo
  ansible.builtin.lineinfile:
    create: true
    dest: /etc/sudoers.d/{{ normalize_username }}
    state: present
    regexp: ^{{ normalize_username }}
    line: "{{ normalize_username }} ALL=(ALL) NOPASSWD: ALL"
    mode: "0640"
    validate: visudo -cf %s

- name: lock the root account
  ansible.builtin.user:
    name: root
    password_lock: true
  when: normalize_lock_root_password | bool
  # no_log: true
