---
argument_specs:
  main:
    short_description: prepare a host for subsequent golden-image builds
    options:
      normalize_username:
        description: Nonempty account name to create and grant passwordless sudo.
        type: str
        required: true
      normalize_password:
        no_log: true
        description: Optional nonempty plaintext password secret; omit for key-only access.
        type: str
      normalize_key:
        description: SSH authorized-key string; unset, null, or blank leaves existing keys unchanged.
        type: raw
      normalize_lock_user_password_when_undefined:
        description: Replace the user's password with a locked value when normalize_password is omitted.
        type: bool
        default: true
      normalize_lock_root_password:
        description: Lock root password authentication; false does not unlock an existing lock.
        type: bool
        default: true
      normalize_selinux_state:
        description: SELinux state to configure with the targeted policy.
        type: str
        default: enforcing
        choices:
          - enforcing
          - permissive
          - disabled
      normalize_tmp_mount_size:
        description: false or empty disables tmp.mount at boot; a size string enables it after restart.
        type: raw
        default: false
      normalize_tmp_cleanup_days:
        description: Positive whole-day age for native cleanup under /tmp, independent of its filesystem.
        type: int
        default: 7
      normalize_var_tmp_cleanup_days:
        description: Positive whole-day age for native cleanup under /var/tmp.
        type: int
        default: 14
      normalize_reboot_delay:
        description: Nonnegative post-reboot wait in seconds.
        type: int
        default: 180
      normalize_remove_ssh_host_keys:
        description: Delete SSH host keys during normalize-cleanup.
        type: bool
        default: true
      provider:
        description: Optional build provider; ec2 skips reboot, vagrant_vmware and vagrant_qemu add guest setup.
        type: str
